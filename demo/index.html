function render() {
  document.getElementById('app').innerHTML = '';
  const el = buildView();
  document.getElementById('app').appendChild(el);
  applyInitialState();
}

function setView(view, dealId) {
  APP.view = view;
  if (dealId) {
    APP.currentDeal = APP.deals.find(d => d.id === dealId);
    APP.workspaceTab = 'conditions';
    APP.settlementValidated = false;
    APP.settlementResult = null;
    APP.messagesParty = null;
  }
  render();
}

function showToast(msg, type='success') {
  APP.toast = { msg, type };
  clearTimeout(APP.toastTimer);
  render();
  APP.toastTimer = setTimeout(() => { APP.toast = null; render(); }, 3000);
}

function loginWithCredentials() {
  const user = MOCK_USERS.find(u =>
    u.username === APP.loginUsername.trim().toLowerCase() &&
    u.password === APP.loginPassword
  );
  if (!user) {
    APP.loginError = 'Incorrect username or password.';
    render();
    return;
  }
  APP.currentUser = user;
  APP.view = 'dashboard';
  APP.loginUsername = '';
  APP.loginPassword = '';
  APP.loginError = '';
  render();
}

// ── Condition helpers ──────────────────────────────────────────────────────
function condActivity(deal, type, msg, icon, bg) {
  deal.activity.unshift({ id:'a'+Date.now(), type, msg, role:APP.currentUser?.role||'', name:APP.currentUser?.name||'', time:'Just now', icon, bg });
}

function canActOnCondition(cond) {
  if (!APP.currentUser) return false;
  const role = APP.currentUser.role;
  if (role === 'ADMIN') return true;
  const a = (cond.assignedTo||'').toLowerCase();
  if (!a) return true;
  if (a.includes('buyer') && a.includes('conveyancer')) return role==='BUYER_CONVEYANCER';
  if (a.includes('seller') && a.includes('conveyancer')) return role==='SELLER_CONVEYANCER';
  if (a.includes('buyer')) return role==='BUYER'||role==='BUYER_CONVEYANCER';
  if (a.includes('seller')) return role==='SELLER'||role==='SELLER_CONVEYANCER';
  if (a.includes('agent')) return role==='AGENT'||role==='ADMIN';
  return true;
}

function checkDealReadiness(deal) {
  const allMet = deal.conditions.length > 0 && deal.conditions.every(c => c.status==='MET'||c.status==='WAIVED');
  if (allMet && deal.status==='ACTIVE') {
    if (isConveyancer()) {
      showToast('🎉 All conditions met! You can approve the deal for settlement.', 'success');
    } else {
      showToast('All conditions met — awaiting conveyancer approval for settlement.');
    }
  }
}

function markConditionMet(dealId, condId) {
  const deal = APP.deals.find(d => d.id === dealId);
  const cond = deal.conditions.find(c => c.id === condId);
  cond.status = 'MET';
  cond.metAt = 'Just now';
  condActivity(deal, 'CONDITION_MET', `${APP.currentUser.name} marked "${cond.name}" as complete`, '✅', 'bg-green-50 border-green-100');
  APP.currentDeal = deal;
  APP.settlementValidated = false;
  APP.settlementResult = null;
  showToast(`"${cond.name}" marked as complete`);
  checkDealReadiness(deal);
  render();
}

function requestConditionApproval(dealId, condId) {
  const deal = APP.deals.find(d => d.id === dealId);
  const cond = deal.conditions.find(c => c.id === condId);
  cond.status = 'AWAITING_APPROVAL';
  cond.submittedBy = APP.currentUser.name;
  cond.submittedAt = 'Just now';
  const verb = cond.type==='DOCUMENT_UPLOAD' ? 'uploaded document for' : 'requested approval on';
  condActivity(deal, 'CONDITION_SUBMITTED', `${APP.currentUser.name} ${verb} "${cond.name}" — awaiting conveyancer approval`, '📤', 'bg-blue-50 border-blue-100');
  APP.currentDeal = deal;
  showToast(`Approval requested for "${cond.name}"`);
  // notify conveyancer
  const conveyancer = deal.parties.find(p => p.role?.includes('Conveyancer'));
  if (conveyancer) condActivity(deal, 'SYSTEM', `Notification sent to ${conveyancer.name}: approval required on "${cond.name}"`, '🔔', 'bg-white border-gray-200');
  render();
}

function approveCondition(dealId, condId) {
  const deal = APP.deals.find(d => d.id === dealId);
  const cond = deal.conditions.find(c => c.id === condId);
  cond.status = 'MET';
  cond.metAt = 'Just now';
  condActivity(deal, 'CONDITION_MET', `${APP.currentUser.name} approved "${cond.name}"`, '✅', 'bg-green-50 border-green-100');
  if (cond.submittedBy) {
    const submitter = deal.parties.find(p => p.name === cond.submittedBy);
    if (submitter) condActivity(deal, 'SYSTEM', `Notification sent to ${cond.submittedBy}: "${cond.name}" has been approved`, '🔔', 'bg-white border-gray-200');
  }
  APP.currentDeal = deal;
  APP.settlementValidated = false;
  APP.settlementResult = null;
  showToast(`"${cond.name}" approved ✓`);
  checkDealReadiness(deal);
  render();
}

function rejectCondition(dealId, condId) {
  const deal = APP.deals.find(d => d.id === dealId);
  const cond = deal.conditions.find(c => c.id === condId);
  const reason = prompt(`Reason for rejecting "${cond.name}":`);
  if (reason === null) return;
  cond.status = 'PENDING';
  cond.rejectedReason = reason || 'No reason given';
  delete cond.submittedBy;
  delete cond.submittedAt;
  condActivity(deal, 'CONDITION_REJECTED', `${APP.currentUser.name} rejected "${cond.name}"${reason?' — '+reason:''}`, '❌', 'bg-red-50 border-red-100');
  const partyNotify = deal.parties.find(p => p.role && !p.role.includes('Conveyancer') && p.name !== APP.currentUser.name);
  if (partyNotify) condActivity(deal, 'SYSTEM', `Notification sent to ${partyNotify.name}: "${cond.name}" needs resubmission`, '🔔', 'bg-white border-gray-200');
  APP.currentDeal = deal;
  showToast(`"${cond.name}" sent back for revision`, 'error');
  render();
}

function waiveCondition(dealId, condId) {
  const deal = APP.deals.find(d => d.id === dealId);
  const cond = deal.conditions.find(c => c.id === condId);
  const reason = prompt(`Reason for waiving "${cond.name}":`);
  if (reason === null) return;
  cond.status = 'WAIVED';
  cond.waivedReason = reason || 'Waived by conveyancer';
  cond.metAt = 'Just now';
  condActivity(deal, 'CONDITION_WAIVED', `${APP.currentUser.name} waived "${cond.name}"${reason?' — '+reason:''}`, '〜', 'bg-amber-50 border-amber-100');
  APP.currentDeal = deal;
  APP.settlementValidated = false;
  APP.settlementResult = null;
  showToast(`"${cond.name}" waived`);
  checkDealReadiness(deal);
  render();
}

function validateSettlement() {
  const deal = APP.currentDeal;
  const pending = deal.conditions.filter(c => c.status === 'PENDING');
  const canSettle = pending.length === 0 && deal.depositPaid;
  APP.settlementValidated = true;
  APP.settlementResult = { canSettle, blockers: [
    ...pending.map(c => `"${c.name}" not yet met`),
    ...(!deal.depositPaid ? ['Deposit not confirmed as paid'] : []),
  ]};
  render();
}

function approveSettlement() {
  const deal = APP.deals.find(d => d.id === APP.currentDeal.id);
  deal.status = 'READY';
  deal.activity.unshift({
    id:'a'+Date.now(), type:'SETTLEMENT_APPROVED',
    msg:`${APP.currentUser.name} approved deal for settlement`,
    role: APP.currentUser.role, time:'Just now',
    icon:'🔐', bg:'bg-indigo-50 border-indigo-100'
  });
  APP.currentDeal = deal;
  APP.settlementValidated = false;

function executeSettlement() {
  const deal = APP.deals.find(d => d.id === APP.currentDeal.id);
  deal.status = 'SETTLED';
  deal.depositPaid = true;
  const lodgementRef = 'AU-2024-' + Math.floor(Math.random()*90000+10000);

    id:'a'+Date.now(), type:'SETTLEMENT_EXECUTED',
    msg:`Settlement completed. PEXA lodgement ref: ${lodgementRef}`,
    role:'System', time:'Just now',
    icon:'🏠', bg:'bg-green-50 border-green-200'
  });
  APP.currentDeal = deal;
  APP.settlementValidated = false;
  APP.settlementResult = null;
  showToast('Settlement executed — PEXA notified.');

function investInPool(poolId) {
  const amt = parseFloat(APP.investAmount);
  const pool = MOCK_POOLS.find(p => p.id === poolId);
  if (!amt || amt < pool.minInvestment) { showToast('Min investment is $' + pool.minInvestment.toLocaleString(), 'error'); return; }
  if (pool.status === 'FUNDED') { showToast('This pool is fully funded', 'error'); return; }

  const feeAUD    = parseFloat((amt * PLATFORM_FEE_RATE).toFixed(2));
  const netAmt    = parseFloat((amt - feeAUD).toFixed(2));
  const feeCrypto = parseFloat(cryptoEquiv(feeAUD, APP.selectedCrypto));

  pool.amountRaised = Math.min(pool.amountRaised + netAmt, pool.targetRaise);
  if (pool.amountRaised >= pool.targetRaise) pool.status = 'FUNDED';
  pool.investorCount += 1;

  APP.portfolio.push({ poolId, poolName: pool.name, amount: amt, crypto: APP.selectedCrypto, date: new Date().toLocaleDateString('en-AU'), expectedYield: pool.expectedYield });

  APP.platformFees.push({
    id: 'fee_' + Date.now(),
    poolId, poolName: pool.name,
    grossAUD: amt, feeAUD, netAUD: netAmt,
    feeCrypto, crypto: APP.selectedCrypto,
    date: new Date().toLocaleDateString('en-AU'),
  });
  APP.ownerWalletBalance.AUD    = parseFloat((APP.ownerWalletBalance.AUD + feeAUD).toFixed(2));
  APP.ownerWalletBalance[APP.selectedCrypto] = parseFloat(
    (APP.ownerWalletBalance[APP.selectedCrypto] + feeCrypto).toFixed(8)
  );

  APP.investAmount = '';
  const pmLabels = { visa:'Visa card', mastercard:'Mastercard', paypal:'PayPal', crypto:'crypto wallet', bank:'bank transfer' };
  showToast(`Investment confirmed via ${pmLabels[APP.checkoutPaymentMethod]||'payment'} — 2% fee A$${feeAUD.toLocaleString()} applied`);
}

function cryptoEquiv(audAmount, crypto) {
  const val = audAmount / CRYPTO_PRICES[crypto];
  if (crypto === 'BTC') return val.toFixed(6);
  if (crypto === 'ETH') return val.toFixed(4);
  return val.toFixed(2);
}

function openCheckout(poolId, inputId) {
  const pool = MOCK_POOLS.find(p => p.id === poolId);
  const amt = parseFloat(document.getElementById(inputId)?.value);
  if (!amt || amt < pool.minInvestment) { showToast('Min investment is $' + pool.minInvestment.toLocaleString(), 'error'); return; }
  if (pool.status === 'FUNDED') { showToast('This pool is fully funded', 'error'); return; }
  APP.investAmount = String(amt);
  APP.checkoutPoolId = poolId;
  APP.checkoutAmount = amt;
  render();
}

function confirmInvestment() {
  if (APP.checkoutPaymentMethod === 'crypto' && !APP.walletConnected) {
    APP.showPaymentModal = true; render(); return;
  }
  const poolId = APP.checkoutPoolId;
  APP.checkoutPoolId = null;
  APP.checkoutAmount = 0;
  investInPool(poolId);
}

function confirmBuyNow() {
  if (APP.checkoutPaymentMethod === 'crypto' && !APP.walletConnected) {
    APP.showPaymentModal = true; render(); return;
  }
  const listing = MOCK_LISTINGS.find(l => l.id === APP.buyNowListingId);
  const fee = parseFloat((listing.price * PLATFORM_FEE_RATE).toFixed(2));
  APP.platformFees.push({ id:'fee_'+Date.now(), poolId:null, poolName:listing.address, grossAUD:listing.price, feeAUD:fee, netAUD:listing.price-fee, feeCrypto:cryptoEquiv(fee, APP.selectedCrypto||'BTC'), crypto:APP.selectedCrypto||'BTC', date:new Date().toLocaleDateString('en-AU') });
  APP.ownerWalletBalance.AUD = parseFloat((APP.ownerWalletBalance.AUD + fee).toFixed(2));
  const pm = APP.checkoutPaymentMethod;
  const labels = { visa:'Visa card', mastercard:'Mastercard', paypal:'PayPal', crypto:'crypto wallet', bank:'bank transfer' };
  APP.buyNowListingId = null;
  showToast(`Purchase initiated via ${labels[pm]||'payment'}. Our settlement team will be in touch.`);
}

    // Also link pool back to the listing
    const newListing = MOCK_LISTINGS.find(l => l.id === newId);

  showToast('Listing submitted for review. Our team will approve it shortly.');
}

// ── Helpers ───────────────────────────────────────────────────────────────
function el(tag, cls='', html='') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  return e;
}
function btn(label, cls, onclick) {
  const b = el('button', cls);
  b.innerHTML = label;
  b.onclick = onclick;
  return b;
}
function statusBadge(status) {
  const map = {
    INIT:      ['bg-gray-100 text-gray-700', 'Initiated'],
    ACTIVE:    ['bg-blue-100 text-blue-700', 'In Progress'],
    READY:     ['bg-amber-100 text-amber-700', 'Ready to Settle'],
    SETTLED:   ['bg-green-100 text-green-700', 'Settled'],
    CANCELLED: ['bg-red-100 text-red-700', 'Cancelled'],
  };
  const [cls, label] = map[status] || ['bg-gray-100 text-gray-700', status];
  return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}">${label}</span>`;
}
function condBadge(status) {
  const map = { MET:'text-green-600', PENDING:'text-gray-400', WAIVED:'text-amber-600', FAILED:'text-red-600' };
  const icons = { MET:'✓', PENDING:'○', WAIVED:'~', FAILED:'✗' };
  return `<span class="font-bold text-sm ${map[status]}">${icons[status]}</span>`;
}
function fmtPrice(p) {
  if (!p) return '$0';
  if (p >= 1000000) {
    const m = p / 1000000;
    return '$' + (m === Math.floor(m) ? m.toFixed(0) : parseFloat(m.toFixed(2))) + 'm';
  }
  if (p >= 1000) {
    const k = p / 1000;
    return '$' + (k === Math.floor(k) ? k.toFixed(0) : parseFloat(k.toFixed(1))) + 'k';
  }
  return '$' + p;
}
function condMetCount(deal) {
  return deal.conditions.filter(c => c.status==='MET'||c.status==='WAIVED').length;
}
function isConveyancer() {
  return APP.currentUser?.role?.includes('CONVEYANCER') || APP.currentUser?.role==='ADMIN';
}

// TOAST

function buildToast({ msg, type }) {
  const t = el('div',
    `fixed bottom-6 right-6 z-50 fade-in px-5 py-3 rounded-xl shadow-lg text-sm font-medium text-white flex items-center gap-3 ${type==='success'?'bg-gray-900':'bg-red-600'}`);

}

function toggleSidebarNav() {
  const nav = document.getElementById('navItems');
  const user = document.getElementById('sidebarUserSection');
  const iconOpen  = document.getElementById('sb-icon-open');
  const iconClose = document.getElementById('sb-icon-close');
  if (!nav) return;
  const hidden = nav.style.display === 'none';
  nav.style.display   = hidden ? '' : 'none';
  if (user) user.style.display = hidden ? '' : 'none';
  if (iconOpen)  iconOpen.style.opacity  = hidden ? '0' : '1';
  if (iconClose) iconClose.style.opacity = hidden ? '1' : '0';
}

function toggleBrowseNav() {
  const nav     = document.getElementById('browseNav');
  const actions = document.getElementById('browseNavActions');
  const iconOpen  = document.getElementById('browse-icon-open');
  const iconClose = document.getElementById('browse-icon-close');
  if (!nav) return;
  const hidden = nav.style.display === 'none';
  nav.style.display     = hidden ? '' : 'none';
  if (actions) actions.style.display = hidden ? '' : 'none';
  if (iconOpen)  iconOpen.style.opacity  = hidden ? '0' : '1';
  if (iconClose) iconClose.style.opacity = hidden ? '1' : '0';
}

function applyInitialState() {
  const mobile = window.innerWidth <= 640;
  // Authenticated sidebar
  const nav  = document.getElementById('navItems');
  const user = document.getElementById('sidebarUserSection');
  const sbOpen  = document.getElementById('sb-icon-open');
  const sbClose = document.getElementById('sb-icon-close');
  if (nav) {
    nav.style.display   = mobile ? 'none' : '';
    if (user) user.style.display = mobile ? 'none' : '';
    if (sbOpen)  sbOpen.style.opacity  = mobile ? '1' : '0';
    if (sbClose) sbClose.style.opacity = mobile ? '0' : '1';
  }
  // Browse sidebar
  const bNav    = document.getElementById('browseNav');
  const bActions= document.getElementById('browseNavActions');
  const brOpen  = document.getElementById('browse-icon-open');
  const brClose = document.getElementById('browse-icon-close');
  if (bNav) {
    bNav.style.display     = mobile ? 'none' : '';
    if (bActions) bActions.style.display = mobile ? 'none' : '';
    if (brOpen)  brOpen.style.opacity  = mobile ? '1' : '0';
    if (brClose) brClose.style.opacity = mobile ? '0' : '1';
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
function buildDashboard() {
  const deals = APP.deals;
  const active = deals.filter(d=>d.status==='ACTIVE').length;
  const ready  = deals.filter(d=>d.status==='READY').length;
  const settled= deals.filter(d=>d.status==='SETTLED').length;
  const urgent = deals.filter(d=>d.daysToSettle!=null&&d.daysToSettle<=7&&d.status!=='SETTLED').length;

  const h = new Date().getHours();
  const greet = h<12?'morning':h<18?'afternoon':'evening';

  const page = el('div', 'p-8');
  page.innerHTML = `
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Good ${greet}, ${APP.currentUser?.name?.split(' ')[0]}</h1>
        <p class="text-sm text-gray-400 mt-0.5">${APP.currentUser?.role?.replace(/_/g,' ')} · ${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</p>
      </div>
      <button onclick="setView('deals')" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Deal
      </button>
    </div>

    <div class="grid grid-cols-4 gap-4 mb-8">
      <div class="bg-blue-50 border border-blue-100 rounded-xl p-5">
        <p class="text-3xl font-bold text-blue-700">${active}</p>
        <p class="text-sm text-blue-600 mt-1 opacity-80">Active Deals</p>
      </div>
      <div class="bg-amber-50 border border-amber-100 rounded-xl p-5">
        <p class="text-3xl font-bold text-amber-700">${ready}</p>
        <p class="text-sm text-amber-600 mt-1 opacity-80">Ready to Settle</p>
      </div>
      <div class="bg-green-50 border border-green-100 rounded-xl p-5">
        <p class="text-3xl font-bold text-green-700">${settled}</p>
        <p class="text-sm text-green-600 mt-1 opacity-80">Settled (All Time)</p>
      </div>
      <div class="bg-red-50 border border-red-100 rounded-xl p-5">
        <p class="text-3xl font-bold text-red-700">${urgent}</p>
        <p class="text-sm text-red-600 mt-1 opacity-80">Due This Week</p>
      </div>
    </div>

    <div class="mb-8">
      <div class="flex items-center gap-2 mb-3">
        <span class="w-2 h-2 bg-amber-500 rounded-full pulse-dot"></span>
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Requires Attention</h2>
      </div>
      <div id="urgentDeals" class="grid grid-cols-2 gap-3"></div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Recent Deals</h2>
        <button onclick="setView('deals')" class="text-sm text-indigo-600 hover:text-indigo-700">View all →</button>
      </div>
      <div id="recentDeals" class="grid grid-cols-2 gap-3"></div>
    </div>`;

  const urgentDeals = page.querySelector('#urgentDeals');
  const urgent2 = deals.filter(d=>d.status==='READY'||(d.daysToSettle!=null&&d.daysToSettle<=14&&d.status==='ACTIVE'));
  if (urgent2.length===0) {
    urgentDeals.innerHTML = '<p class="col-span-2 text-sm text-gray-400">No deals requiring immediate attention.</p>';
  }
  urgent2.forEach(d => urgentDeals.appendChild(buildDealCard(d)));

  const recentDeals = page.querySelector('#recentDeals');
  deals.filter(d=>d.status!=='SETTLED').slice(0,4).forEach(d => recentDeals.appendChild(buildDealCard(d)));
  return page;
}

// ═══════════════════════════════════════════════════════════════════════════
// DEAL CARD
// ═══════════════════════════════════════════════════════════════════════════
function buildDealCard(deal) {
  const met = condMetCount(deal);
  const total = deal.conditions.length;
  const pct = total > 0 ? Math.round(met/total*100) : 0;
  const urgent = deal.daysToSettle!=null && deal.daysToSettle<=7;

  const card = el('div', 'bg-white rounded-xl border border-gray-200 shadow-sm p-5 cursor-pointer hover:shadow-md transition-shadow group');
  card.onclick = () => setView('workspace', deal.id);
  card.innerHTML = `
    <div class="flex items-start justify-between mb-3">
      <div class="min-w-0 flex-1">
        <p class="font-semibold text-gray-900 text-sm truncate group-hover:text-indigo-600 transition-colors">${deal.address}</p>
        <p class="text-xs text-gray-400 mt-0.5">${deal.referenceNo}</p>
      </div>
      <div class="ml-3 flex-shrink-0">${statusBadge(deal.status)}</div>
    </div>
    <div class="flex items-center justify-between text-sm text-gray-500 mb-3">
      <span class="font-medium">${fmtPrice(deal.price)}</span>
      ${deal.daysToSettle!=null ? `<span class="${urgent?'text-red-600 font-medium flex items-center gap-1':''}">
        ${urgent?'<span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>':''}
        ${deal.status==='SETTLED'?'Settled':deal.daysToSettle+'d to settle'}
      </span>` : ''}
    </div>
    ${total > 0 ? `
    <div>
      <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
        <span>Conditions</span><span>${met}/${total}</span>
      </div>
      <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full bg-green-500 rounded-full progress-bar" style="width:${pct}%"></div>
      </div>
    </div>` : ''}
    ${deal.parties.length > 0 ? `
    <div class="flex -space-x-1 mt-3">
      ${deal.parties.slice(0,4).map(p=>`
        <div class="w-6 h-6 rounded-full ${p.color} border-2 border-white flex items-center justify-center" title="${p.name} (${p.role})">
          <span class="text-[9px] font-bold">${p.initials}</span>
        </div>`).join('')}
      ${deal.parties.length>4?`<div class="w-6 h-6 rounded-full bg-gray-100 border-2 border-white flex items-center justify-center"><span class="text-[9px] text-gray-500">+${deal.parties.length-4}</span></div>`:''}
    </div>` : ''}`;
  return card;
}

// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════
function buildDeals() {
  const page = el('div', 'p-8');
  page.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Deals</h1>
      <button onclick="showToast('New deal form — connect backend to save ✓')"
        class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Deal
      </button>
    </div>
    <div class="grid grid-cols-1 gap-3 lg:grid-cols-2 xl:grid-cols-3" id="dealsGrid"></div>`;
  const grid = page.querySelector('#dealsGrid');
  APP.deals.forEach(d => grid.appendChild(buildDealCard(d)));
  return page;
}

// ═══════════════════════════════════════════════════════════════════════════
// DEAL WORKSPACE
// ═══════════════════════════════════════════════════════════════════════════
function buildWorkspace() {
  const deal = APP.currentDeal;
  if (!deal) { setView('deals'); return el('div'); }

  const page = el('div', 'p-8');
  const condMet = condMetCount(deal);
  const condTotal = deal.conditions.length;

  // Determine PEXA ref
  const pexaRef = deal.pexaRef || (deal.status==='SETTLED'?'AU-2024-78901':null);

  page.innerHTML = `
    <!-- Breadcrumb & header -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <button onclick="setView('deals')" class="text-gray-400 hover:text-gray-600 text-sm">← Deals</button>
          <span class="text-gray-300">/</span>
          <span class="text-sm text-gray-400">${deal.referenceNo}</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">${deal.address.split(',')[0]}</h1>
        <p class="text-sm text-gray-400 mt-0.5">
          ${deal.address.split(',').slice(1).join(',').trim()}
          ${deal.titleRef?`<span class="ml-2 text-gray-300">· CT ${deal.titleRef}</span>`:''}
        </p>
      </div>
      <div class="flex items-center gap-3">
        ${deal.daysToSettle!=null&&deal.status!=='SETTLED'?`
          <div class="text-sm px-3 py-1.5 rounded-lg ${deal.daysToSettle<=7?'bg-red-100 text-red-700':'bg-gray-100 text-gray-600'}">
            ${deal.daysToSettle>=0?deal.daysToSettle+'d to settle':'Overdue'}
          </div>`:deal.status==='SETTLED'?`<div class="text-sm px-3 py-1.5 rounded-lg bg-green-100 text-green-700">Settled ✓</div>`:''}
        ${statusBadge(deal.status)}
      </div>
    </div>

    <!-- Key stats -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-400 mb-1">Purchase Price</p>
        <p class="text-xl font-bold text-gray-900">${fmtPrice(deal.price)}</p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-400 mb-1">Deposit</p>
        <p class="text-xl font-bold text-gray-900">${fmtPrice(deal.deposit)}</p>
        ${deal.depositPaid?'<span class="text-xs text-green-600 font-medium">✓ Paid</span>':'<span class="text-xs text-amber-500">Pending</span>'}
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <p class="text-xs text-gray-400 mb-1">Settlement Date</p>
        <p class="text-xl font-bold text-gray-900">${deal.settlementDate||'—'}</p>
      </div>
    </div>

    <!-- Parties -->
    ${deal.parties.length>0?`
    <div class="bg-white rounded-xl border border-gray-200 p-5 mb-6">
      <h3 class="font-semibold text-gray-900 mb-3">Parties</h3>
      <div class="flex flex-wrap gap-4">
        ${deal.parties.map(p=>`
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full ${p.color} flex items-center justify-center flex-shrink-0">
              <span class="text-xs font-bold">${p.initials}</span>
            </div>
            <div>
              <p class="text-sm font-medium text-gray-900">${p.name}</p>
              <p class="text-xs text-gray-400">${p.role}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>`:''}

    <!-- Main Grid -->
    <div class="grid grid-cols-3 gap-6">
      <!-- Left: Timeline + Tabs -->
      <div class="col-span-2 space-y-5">
        <!-- Timeline -->
        ${deal.milestones.length>0?buildTimelineHTML(deal):''}
        <!-- Tab bar -->
        <div class="bg-white rounded-xl border border-gray-200">
          <div class="flex border-b border-gray-100">
            ${['conditions','documents','audit','messages'].map(t=>`
              <button onclick="APP.workspaceTab='${t}';APP.currentDeal=APP.deals.find(d=>d.id==='${deal.id}');render()"
                class="px-5 py-3 text-sm font-medium transition-colors ${APP.workspaceTab===t?'text-indigo-600 border-b-2 border-indigo-500 -mb-px':'text-gray-500 hover:text-gray-700'}">
                ${t.charAt(0).toUpperCase()+t.slice(1)}
                ${t==='conditions'&&condTotal>0?`<span class="ml-1.5 px-1.5 py-0.5 text-xs rounded-full ${condMet===condTotal?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}">${condMet}/${condTotal}</span>`:''}
                ${t==='messages'?`<span class="ml-1.5 px-1.5 py-0.5 text-xs rounded-full bg-gray-100 text-gray-500">${deal.parties.filter(p=>p.name!==APP.currentUser?.name).length}</span>`:''}
              </button>`).join('')}
          </div>
          <div class="p-5" id="tabContent"></div>
        </div>
      </div>
      <!-- Right: Settlement + Activity -->
      <div class="space-y-5" id="rightCol"></div>
    </div>`;

  // Tab content
  const tabContent = page.querySelector('#tabContent');
  if (APP.workspaceTab === 'conditions') tabContent.appendChild(buildConditionsTab(deal));
  else if (APP.workspaceTab === 'documents') tabContent.innerHTML = buildDocumentsTab(deal);
  else if (APP.workspaceTab === 'audit') tabContent.innerHTML = buildAuditTab(deal);
  else if (APP.workspaceTab === 'messages') tabContent.appendChild(buildMessagesTab(deal));

  // Right column
  const rightCol = page.querySelector('#rightCol');
  rightCol.appendChild(buildSettlementPanel(deal));
  rightCol.appendChild(buildActivityFeed(deal));

  return page;
}

function buildTimelineHTML(deal) {
  const done = deal.milestones.filter(m=>m.status==='COMPLETE').length;
  const pct = Math.round(done/deal.milestones.length*100);
  const cfg = { COMPLETE:{dot:'bg-green-500 text-white ring-green-200',icon:'✓'}, IN_PROGRESS:{dot:'bg-indigo-500 text-white ring-indigo-200',icon:'●'}, PENDING:{dot:'bg-gray-200 text-gray-400 ring-gray-100',icon:'○'}, BLOCKED:{dot:'bg-red-500 text-white ring-red-200',icon:'!'} };
  return `
  <div class="bg-white rounded-xl border border-gray-200 p-5">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-semibold text-gray-900">Timeline</h3>
      <span class="text-sm text-gray-400">${done}/${deal.milestones.length} complete</span>
    </div>
    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden mb-5">
      <div class="h-full bg-green-500 rounded-full progress-bar" style="width:${pct}%"></div>
    </div>
    <div class="relative">
      <div class="absolute left-[15px] top-4 bottom-4 w-0.5 bg-gray-100"></div>
      <div class="space-y-3">
        ${deal.milestones.map(m=>{
          const c = cfg[m.status];
          return `<div class="flex items-start gap-3">
            <div class="relative z-10 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ring-4 ${c.dot} ${cfg[m.status]?.ring||'ring-gray-100'}">
              ${c.icon}
            </div>
            <div class="flex-1 pt-1">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium ${m.status==='COMPLETE'?'text-gray-400 line-through':m.status==='IN_PROGRESS'?'text-indigo-700':m.status==='BLOCKED'?'text-red-700':'text-gray-700'}">${m.name}</p>
                ${m.date?`<span class="text-xs text-gray-400">${m.date}</span>`:''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function buildConditionsTab(deal) {
  const wrap = el('div', 'space-y-3');
  if (deal.conditions.length === 0) {
    wrap.innerHTML = '<p class="text-sm text-gray-400 text-center py-6">No conditions configured.</p>';
    return wrap;
  }

  const met = condMetCount(deal);
  const total = deal.conditions.length;
  const allMet = met === total;
  const pct = Math.round(met / total * 100);

  // ── Progress header ──────────────────────────────────────────────────────
  const header = el('div', `p-4 rounded-xl border mb-1 ${allMet?'bg-green-50 border-green-200':'bg-white border-gray-200'}`);
  header.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-semibold ${allMet?'text-green-700':'text-gray-700'}">${allMet?'✅ All conditions met':'⏳ '+met+' of '+total+' conditions complete'}</span>
      <span class="text-sm font-bold ${allMet?'text-green-600':'text-indigo-600'}">${pct}%</span>
    </div>
    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
      <div class="h-full rounded-full transition-all ${allMet?'bg-green-500':'bg-indigo-500'}" style="width:${pct}%"></div>
    </div>
    ${allMet && deal.status==='ACTIVE' && isConveyancer()
      ? `<p class="text-xs text-green-700 mt-2 font-medium">All conditions satisfied — use the Settlement panel to approve for settlement.</p>`
      : !allMet
        ? `<p class="text-xs text-gray-400 mt-2">${total-met} condition${total-met!==1?'s':''} still pending</p>`
        : ''}`;
  wrap.appendChild(header);

  // ── Type badge colours ───────────────────────────────────────────────────
  const typeBadge = { BOOLEAN_FLAG:'bg-indigo-50 text-indigo-600', DOCUMENT_UPLOAD:'bg-blue-50 text-blue-600', APPROVAL:'bg-purple-50 text-purple-600', EXTERNAL_CONFIRMATION:'bg-gray-100 text-gray-600' };
  const typeLabel = { BOOLEAN_FLAG:'Flag', DOCUMENT_UPLOAD:'Document', APPROVAL:'Approval', EXTERNAL_CONFIRMATION:'External' };

  // ── Condition cards ──────────────────────────────────────────────────────
  deal.conditions.forEach(cond => {
    const isAwaiting  = cond.status === 'AWAITING_APPROVAL';
    const isMet       = cond.status === 'MET';
    const isWaived    = cond.status === 'WAIVED';
    const isFailed    = cond.status === 'FAILED';
    const isPending   = cond.status === 'PENDING';
    const canAct      = canActOnCondition(cond);
    const canApprove  = isConveyancer();

    // Border colour
    const borderCls = isMet?'border-green-200 bg-green-50':isWaived?'border-amber-200 bg-amber-50':isFailed?'border-red-200 bg-red-50':isAwaiting?'border-blue-200 bg-blue-50':'border-gray-200 bg-white';

    const card = el('div', `border rounded-xl p-4 transition-colors ${borderCls}`);

    // Status icon
    const iconMap = { MET:'✅', WAIVED:'〜', FAILED:'❌', AWAITING_APPROVAL:'⏳', PENDING:'○' };

    card.innerHTML = `
      <div class="flex items-start gap-3">
        <!-- Status icon -->
        <span class="text-base mt-0.5 flex-shrink-0">${iconMap[cond.status]||'○'}</span>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2 flex-wrap">
            <div class="min-w-0">
              <p class="text-sm font-semibold text-gray-900">${cond.name}</p>
              ${cond.desc?`<p class="text-xs text-gray-400 mt-0.5">${cond.desc}</p>`:''}
            </div>
            <!-- Type badge -->
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded flex-shrink-0 ${typeBadge[cond.type]||'bg-gray-100 text-gray-600'}">${typeLabel[cond.type]||cond.type}</span>
          </div>

          <!-- Meta row -->
          <div class="flex items-center gap-3 mt-1.5 flex-wrap text-xs">
            ${cond.assignedTo?`<span class="text-gray-400">→ <span class="font-medium text-gray-600">${cond.assignedTo}</span></span>`:''}
            ${isMet?`<span class="text-green-600 font-medium">Met ${cond.metAt||'✓'}</span>`:''}
            ${isWaived?`<span class="text-amber-600 font-medium">Waived${cond.waivedReason?' — '+cond.waivedReason:''}</span>`:''}
            ${isAwaiting?`<span class="text-blue-600 font-medium">Submitted by ${cond.submittedBy||'party'} · Awaiting approval</span>`:''}
            ${cond.rejectedReason&&isPending?`<span class="text-red-500 font-medium">Rejected: ${cond.rejectedReason} — please resubmit</span>`:''}
          </div>

          <!-- Action buttons -->
          <div class="flex gap-2 mt-3 flex-wrap" id="condActions_${cond.id}"></div>
        </div>
      </div>`;

    const actions = card.querySelector(`#condActions_${cond.id}`);

    if (isPending) {
      if (canAct) {
        if (cond.type === 'BOOLEAN_FLAG') {
          // Direct mark complete
          actions.appendChild(btn('✓ Mark Complete',
            'text-xs px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium',
            () => markConditionMet(deal.id, cond.id)));
        } else if (cond.type === 'DOCUMENT_UPLOAD') {
          // Simulated document upload
          const fname = document.createElement('input');
          fname.type = 'text'; fname.placeholder = 'Document name (e.g. Finance_Approval.pdf)';
          fname.className = 'text-xs px-2.5 py-1.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 flex-1 min-w-0';
          actions.appendChild(fname);
          actions.appendChild(btn('📎 Upload',
            'text-xs px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium flex-shrink-0',
            () => {
              if (!fname.value.trim()) { showToast('Enter a document name first', 'error'); return; }
              cond.docName = fname.value.trim();
              cond.submittedBy = APP.currentUser.name;
              requestConditionApproval(deal.id, cond.id);
            }));
        } else if (cond.type === 'APPROVAL') {
          // Request approval from conveyancer
          actions.appendChild(btn('🔔 Request Approval',
            'text-xs px-3 py-1.5 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium',
            () => requestConditionApproval(deal.id, cond.id)));
        } else {
          actions.appendChild(btn('✓ Mark Complete',
            'text-xs px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium',
            () => markConditionMet(deal.id, cond.id)));
        }
      } else {
        // Cannot act — show who needs to act
        const waiting = el('span', 'text-xs text-gray-400 italic');
        waiting.textContent = `Waiting for ${cond.assignedTo||'assigned party'} to act`;
        actions.appendChild(waiting);
      }

      // Conveyancer can always waive a pending condition
      if (canApprove) {
        actions.appendChild(btn('Waive',
          'text-xs px-3 py-1.5 bg-white text-amber-600 border border-amber-300 rounded-lg hover:bg-amber-50 transition-colors',
          () => waiveCondition(deal.id, cond.id)));
      }
    }

    if (isAwaiting) {
      if (canApprove) {
        // Conveyancer approves or rejects
        actions.appendChild(btn('✓ Approve',
          'text-xs px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium',
          () => approveCondition(deal.id, cond.id)));
        actions.appendChild(btn('✗ Reject',
          'text-xs px-3 py-1.5 bg-white text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition-colors font-medium',
          () => rejectCondition(deal.id, cond.id)));
      } else {
        const waiting = el('span', 'text-xs text-blue-500 italic font-medium');
        waiting.textContent = 'Awaiting conveyancer review…';
        actions.appendChild(waiting);
      }
    }

    wrap.appendChild(card);
  });

  return wrap;
}

  return deal.documents.map(doc => `

      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gray-100 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>

          <p class="text-sm font-medium text-gray-900">${doc.name}</p>

      <div class="flex items-center gap-2">
        ${doc.verified

          : '<span class="inline-flex items-center gap-1 text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded-full">Unverified</span>'}
        <button onclick="showToast('Download started (mock)')" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">Download</button>

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES TAB
// ═══════════════════════════════════════════════════════════════════════════
function buildMessagesTab(deal) {
  // If stored party is not in this deal, clear it
  if (APP.messagesParty && !deal.parties.find(p => p.name === APP.messagesParty)) {
    APP.messagesParty = null;
  }

  const otherParties = deal.parties.filter(p => p.name !== APP.currentUser?.name);
  const wrap = el('div', 'flex gap-0 min-h-[360px]');

  // ── Party list (left column) ─────────────────────────────────────────────
  const sidebar = el('div', 'w-52 border-r border-gray-100 pr-4 flex-shrink-0');
  const sideHead = el('p', 'text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3');
  sideHead.textContent = 'Parties';
  sidebar.appendChild(sideHead);

  if (otherParties.length === 0) {
    const empty = el('p', 'text-xs text-gray-400');
    empty.textContent = 'No other parties on this deal.';
    sidebar.appendChild(empty);
  }

  otherParties.forEach(party => {
    const key = `${deal.id}_${party.name}`;
    const msgs = APP.dealMessages[key] || [];
    const lastMsg = msgs[msgs.length - 1];
    const isActive = APP.messagesParty === party.name;

    const row = el('button',
      `w-full text-left px-2 py-2.5 rounded-lg mb-0.5 transition-colors ${isActive ? 'bg-indigo-50 border border-indigo-100' : 'hover:bg-gray-50 border border-transparent'}`
    );
    row.onclick = () => { APP.messagesParty = party.name; render(); };
    row.innerHTML = `
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full flex-shrink-0 ${party.color} flex items-center justify-center">
          <span class="text-[9px] font-bold">${party.initials}</span>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-gray-900 truncate">${party.name}</p>
          <p class="text-[10px] text-gray-400 truncate">${party.role}</p>
        </div>
      </div>
      ${lastMsg ? `<p class="text-[10px] text-gray-400 mt-1 truncate pl-9">${lastMsg.text}</p>` : `<p class="text-[10px] text-gray-400 mt-1 pl-9 italic">No messages yet</p>`}`;
    sidebar.appendChild(row);
  });

  wrap.appendChild(sidebar);

  // ── Chat area (right column) ─────────────────────────────────────────────
  const chat = el('div', 'flex-1 flex flex-col pl-5');

  if (!APP.messagesParty) {
    const placeholder = el('div', 'flex-1 flex flex-col items-center justify-center text-center py-12');
    placeholder.innerHTML = `
      <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3">
        <svg class="w-6 h-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
      </div>
      <p class="text-sm font-medium text-gray-600">Select a party to message</p>
      <p class="text-xs text-gray-400 mt-1">Messages are internal to this deal</p>`;
    chat.appendChild(placeholder);
  } else {
    const party = deal.parties.find(p => p.name === APP.messagesParty);
    const key = `${deal.id}_${APP.messagesParty}`;
    const msgs = APP.dealMessages[key] || [];

    // Header
    const header = el('div', 'flex items-center gap-2.5 pb-3 mb-3 border-b border-gray-100');
    header.innerHTML = `
      <div class="w-8 h-8 rounded-full flex-shrink-0 ${party?.color || 'bg-gray-100'} flex items-center justify-center">
        <span class="text-xs font-bold">${party?.initials || '?'}</span>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-900">${APP.messagesParty}</p>
        <p class="text-xs text-gray-400">${party?.role || ''} · Internal deal message</p>
      </div>`;
    chat.appendChild(header);

    // Message thread
    const feed = el('div', 'flex-1 overflow-y-auto space-y-3 mb-3');
    feed.style.maxHeight = '240px';
    feed.style.minHeight = '160px';

    if (msgs.length === 0) {
      feed.innerHTML = `<div class="flex items-center justify-center h-full py-8">
        <p class="text-xs text-gray-400 italic">No messages yet — start the conversation below.</p>
      </div>`;
    } else {
      msgs.forEach(msg => {
        const isMe = msg.sender === APP.currentUser?.name;
        const row = el('div', `flex ${isMe ? 'justify-end' : 'justify-start'}`);
        row.innerHTML = `
          <div class="max-w-[78%]">
            ${!isMe ? `<p class="text-[10px] text-gray-400 mb-1 ml-1">${msg.sender}</p>` : ''}
            <div class="px-3.5 py-2 rounded-2xl text-sm leading-relaxed ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-gray-100 text-gray-800 rounded-bl-sm'}">
              ${msg.text}
            </div>
            <p class="text-[10px] text-gray-400 mt-1 ${isMe ? 'text-right mr-1' : 'ml-1'}">${msg.time}</p>
          </div>`;
        feed.appendChild(row);
      });
      // Scroll to bottom
      setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 0);
    }
    chat.appendChild(feed);

    // Input row
    const inputRow = el('div', 'flex gap-2');
    const safeParty = APP.messagesParty.replace(/'/g, "\\'");
    inputRow.innerHTML = `
      <input id="msgInput_${deal.id}" type="text" placeholder="Message ${APP.messagesParty.split(' ')[0]}..."
        class="flex-1 text-sm px-3 py-2 rounded-lg border border-gray-300 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        onkeydown="if(event.key==='Enter'){sendDealMessage('${deal.id}','${safeParty}')}"/>
      <button onclick="sendDealMessage('${deal.id}','${safeParty}')"
        class="px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex-shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
        </svg>
      </button>`;
    chat.appendChild(inputRow);
  }

  wrap.appendChild(chat);
  return wrap;
}

function sendDealMessage(dealId, partyName) {
  const input = document.getElementById(`msgInput_${dealId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const key = `${dealId}_${partyName}`;
  if (!APP.dealMessages[key]) APP.dealMessages[key] = [];
  const now = new Date();
  const time = now.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit' });
  APP.dealMessages[key].push({
    id: 'msg_' + Date.now(),
    sender: APP.currentUser.name,
    senderRole: APP.currentUser.role,
    text,
    time: 'Today ' + time,
  });
  input.value = '';
  APP.messagesParty = partyName;
  render();
}

// SETTLEMENT PANEL
// ═══════════════════════════════════════════════════════════════════════════
function buildSettlementPanel(deal) {
  const panel = el('div', 'bg-white rounded-xl border border-gray-200 p-5');

  if (deal.status === 'SETTLED') {
    panel.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <div>
          <p class="font-semibold text-green-800">Settled</p>
          <p class="text-xs text-green-600">${deal.pexaRef?'PEXA ref: '+deal.pexaRef:'Transaction complete'}</p>
        </div>
      </div>`;
    return panel;
  }

  panel.innerHTML = `<h3 class="font-semibold text-gray-900 mb-4">Settlement</h3><div id="settlPanel"></div>`;
  const inner = panel.querySelector('#settlPanel');

  if (!isConveyancer()) {
    inner.innerHTML = `
      <p class="text-sm text-gray-500">Status: <span class="font-medium text-gray-800">${deal.status}</span></p>
      <p class="text-sm text-gray-500 mt-1">Settlement: <span class="font-medium text-gray-800">${deal.settlementDate||'TBC'}</span></p>`;
    return panel;
  }

  if (deal.status === 'ACTIVE') {
    const validateBtn = btn('Check Settlement Readiness',
      'w-full py-2.5 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 transition-colors',
      () => { validateSettlement(); });
    inner.appendChild(validateBtn);

    if (APP.settlementValidated && APP.settlementResult) {
      const res = APP.settlementResult;
      const resultDiv = el('div', `mt-3 p-4 rounded-lg border ${res.canSettle?'bg-green-50 border-green-200':'bg-amber-50 border-amber-200'}`);
      let html = `<p class="text-sm font-semibold ${res.canSettle?'text-green-800':'text-amber-800'}">${res.canSettle?'✓ Ready to settle':'⚠ Not ready to settle'}</p>`;
      if (res.blockers.length > 0) {
        html += `<ul class="mt-2 space-y-1">${res.blockers.map(b=>`<li class="text-xs text-amber-700 flex gap-1"><span>•</span>${b}</li>`).join('')}</ul>`;
      }
      if (res.canSettle) {
        html += `<div class="mt-3">`;
      }
      resultDiv.innerHTML = html;
      inner.appendChild(resultDiv);

      if (res.canSettle) {
        const approveBtn = btn('Approve for Settlement',
          'mt-3 w-full py-2.5 px-4 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors',
          () => approveSettlement());
        inner.appendChild(approveBtn);
      }
    }
  }

  if (deal.status === 'READY') {
    inner.innerHTML = `
      <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg mb-3 text-sm text-amber-800">
        <strong>Ready to settle.</strong> This will trigger PEXA and release escrow.
      </div>`;
    const execBtn = btn(
      `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Execute Settlement`,
      'w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors',
      () => executeSettlement()
    );
    inner.appendChild(execBtn);
  }

  return panel;
}

// CONVEYANCER PIPELINE
// ═══════════════════════════════════════════════════════════════════════════
function buildConveyancer() {
  const deals = APP.deals;
  const actionRequired = deals.filter(d => d.status==='READY' || (d.status==='ACTIVE' && condMetCount(d)===d.conditions.length && d.conditions.length>0));

  const page = el('div', 'p-8');
  page.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Conveyancer Pipeline</h1>
        <p class="text-sm text-gray-400 mt-0.5">Overview of all active matters</p>
      </div>
    </div>

    ${actionRequired.length>0?`
    <div class="mb-8">
      <h2 class="text-sm font-semibold text-red-600 uppercase tracking-wide mb-3 flex items-center gap-2">
        <span class="w-2 h-2 bg-red-500 rounded-full pulse-dot"></span>
        Action Required (${actionRequired.length})
      </h2>
      <div class="space-y-2" id="actionCards"></div>
    </div>`:''}

    <h2 class="text-sm font-semibold text-gray-600 uppercase tracking-wide mb-4">Full Pipeline</h2>
    <div class="grid grid-cols-4 gap-4" id="kanban"></div>`;

  if (actionRequired.length > 0) {
    const container = page.querySelector('#actionCards');
    actionRequired.forEach(deal => {
      const isReady = deal.status === 'READY';
      const card = el('div', 'bg-white rounded-xl border border-gray-200 border-l-4 border-l-red-400 p-4 hover:shadow-md transition-shadow');
      card.innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 cursor-pointer flex-1" onclick="setView('workspace','${deal.id}')">
            <p class="font-semibold text-gray-900 text-sm truncate">${deal.address.split(',')[0]}</p>
            <p class="text-xs text-gray-400 mt-0.5">${deal.referenceNo} · ${fmtPrice(deal.price)}</p>
            <p class="text-xs mt-1 font-medium ${isReady?'text-amber-700':'text-indigo-700'}">
              ${isReady ? '⚡ Ready to execute settlement' : '✅ All conditions met — awaiting approval'}
            </p>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0" id="pipelineActions_${deal.id}"></div>
        </div>`;

      const actions = card.querySelector(`#pipelineActions_${deal.id}`);

      if (isReady) {
        // Execute Settlement directly from pipeline
        const execBtn = btn(
          `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Execute Settlement`,
          'inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors',
          () => {
            if (!confirm(`Execute settlement for ${deal.address.split(',')[0]}? This will trigger PEXA and release escrow.`)) return;
            APP.currentDeal = deal;
            executeSettlement();
            render();
          }
        );
        actions.appendChild(execBtn);
      } else {
        // Approve for Settlement directly from pipeline
        const approveBtn = btn(
          `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Approve for Settlement`,
          'inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors',
          () => {
            if (!confirm(`Approve ${deal.address.split(',')[0]} for settlement? All conditions have been verified.`)) return;
            APP.currentDeal = deal;
            approveSettlement();
            render();
          }
        );
        actions.appendChild(approveBtn);
      }

      // Open workspace link
      const viewBtn = btn('View deal →',
        'text-xs text-gray-400 hover:text-gray-700 transition-colors',
        () => setView('workspace', deal.id)
      );
      actions.appendChild(viewBtn);

      container.appendChild(card);
    });
  }

  const kanban = page.querySelector('#kanban');
  const cols = ['INIT','ACTIVE','READY','SETTLED'];
  const colLabels = { INIT:'Initiated', ACTIVE:'In Progress', READY:'Ready to Settle', SETTLED:'Settled' };
  const colColors = { INIT:'bg-gray-100 text-gray-700', ACTIVE:'bg-blue-100 text-blue-700', READY:'bg-amber-100 text-amber-700', SETTLED:'bg-green-100 text-green-700' };

  cols.forEach(status => {
    const colDeals = deals.filter(d=>d.status===status);
    const col = el('div', 'bg-gray-50 rounded-xl p-3 border border-gray-200');
    col.innerHTML = `
      <div class="flex items-center justify-between mb-3">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${colColors[status]}">${colLabels[status]}</span>
        <span class="text-xs text-gray-400">${colDeals.length}</span>
      </div>
      <div class="space-y-2" id="col-${status}"></div>
      ${colDeals.length===0?'<p class="text-xs text-gray-400 text-center py-4">No deals</p>':''}`;
    const colContainer = col.querySelector(`#col-${status}`);
    colDeals.forEach(d => {
      const card = el('div', 'bg-white rounded-lg border border-gray-200 p-3 cursor-pointer hover:shadow-md transition-shadow');
      card.onclick = () => setView('workspace', d.id);
      const met = condMetCount(d), total = d.conditions.length;
      const pct = total > 0 ? Math.round(met/total*100) : 0;
      card.innerHTML = `
        <p class="text-xs font-semibold text-gray-900 leading-tight truncate">${d.address.split(',')[0]}</p>
        <p class="text-[10px] text-gray-400 mt-0.5">${d.referenceNo}</p>
        ${d.daysToSettle!=null&&d.status!=='SETTLED'?`<p class="text-[10px] text-gray-500 mt-1">${d.daysToSettle}d</p>`:''}
        ${total>0?`<div class="mt-1.5 h-1 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full bg-green-500 rounded-full" style="width:${pct}%"></div>
        </div>`:''}`;
      colContainer.appendChild(card);
    });
    kanban.appendChild(col);
  });

  return page;
}

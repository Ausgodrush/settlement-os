                placeholder="e.g. 12 Campbell Parade"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Suburb <span class="text-rose-500">*</span></label>
              <input type="text" value="${f.suburb}" oninput="APP.listingFormData.suburb=this.value"
                placeholder="e.g. Bondi Beach"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Postcode <span class="text-rose-500">*</span></label>
              <input type="text" value="${f.postcode}" oninput="APP.listingFormData.postcode=this.value"
                placeholder="e.g. 2026"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">State / Region</label>
              <select oninput="APP.listingFormData.state=this.value"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${states.map(s=>`<option value="${s}" ${f.state===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Property Type</label>
              <select oninput="APP.listingFormData.type=this.value"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${types.map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${t}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>

        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Specifications</p>
          <div class="grid grid-cols-4 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Bedrooms</label>
              <input type="number" min="1" max="20" value="${f.beds}" oninput="APP.listingFormData.beds=this.value"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Bathrooms</label>
              <input type="number" min="1" max="20" value="${f.baths}" oninput="APP.listingFormData.baths=this.value"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Parking</label>
              <input type="number" min="0" max="10" value="${f.parking}" oninput="APP.listingFormData.parking=this.value"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Land (m²)</label>
              <input type="number" min="0" value="${f.landSize}" oninput="APP.listingFormData.landSize=this.value"
                placeholder="Optional"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
          </div>
        </div>

        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Pricing</p>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Asking Price (AUD) <span class="text-rose-500">*</span></label>
            <input type="number" min="0" value="${f.price}" oninput="APP.listingFormData.price=this.value"
              placeholder="e.g. 1500000"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Description</label>
          <textarea rows="3" oninput="APP.listingFormData.description=this.value"
            placeholder="Describe the property — location highlights, features, investment potential..."
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none">${f.description}</textarea>
        </div>

        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Photos <span class="text-gray-400 font-normal normal-case">(up to 10 — first photo is the cover)</span></p>
          <div id="listingPhotoGrid" class="grid grid-cols-4 gap-2 mb-3"></div>
          <label class="block cursor-pointer">
            <input type="file" accept="image/*" multiple class="hidden" onchange="addListingPhotos(this)"/>
            <div class="border-2 border-dashed border-gray-300 rounded-xl py-4 px-3 text-center hover:border-indigo-400 hover:bg-indigo-50 transition-colors">
              <p class="text-sm text-gray-500">📷 Click to add photos</p>
              <p class="text-xs text-gray-400 mt-0.5">JPEG · PNG · WEBP — select multiple at once</p>
            </div>
          </label>
        </div>

        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Sale Type</p>
          <div class="grid grid-cols-3 gap-3">
            ${[
              { value:'invest', label:'Investment Pool', sub:'Raise capital from multiple investors', icon:'📊' },
              { value:'buy_now', label:'Buy Now', sub:'Direct full property purchase', icon:'🏠' },
              { value:'both', label:'Both', sub:'Offer investment and direct sale', icon:'✨' },
            ].map(opt => `
            <button onclick="APP.listingFormData.saleType='${opt.value}';render()" type="button"
              class="p-4 rounded-xl border-2 text-left transition-all ${f.saleType===opt.value?'border-indigo-500 bg-indigo-50':'border-gray-200 hover:border-indigo-300'}">
              <div class="text-xl mb-1">${opt.icon}</div>
              <p class="text-sm font-semibold text-gray-800 ${f.saleType===opt.value?'text-indigo-700':''}">${opt.label}</p>
              <p class="text-xs text-gray-400 mt-0.5">${opt.sub}</p>
            </button>`).join('')}
          </div>
        </div>

        ${(f.saleType === 'invest' || f.saleType === 'both') ? `
        <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:20px;">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">📊</span>
            <div>
              <p class="text-sm font-bold text-indigo-800">Investment Pool Details</p>
              <p class="text-xs text-indigo-500 mt-0.5">Configure how investors can buy into this property</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="col-span-2">
              <label class="block text-xs font-medium text-gray-600 mb-1">Fund / Pool Name</label>
              <input type="text" value="${f.poolName}" oninput="APP.listingFormData.poolName=this.value"
                placeholder="e.g. Norwood Residential Fund"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Target Raise (AUD) <span class="text-rose-500">*</span></label>
              <input type="number" min="0" value="${f.targetRaise}" oninput="APP.listingFormData.targetRaise=this.value"
                placeholder="e.g. 500000"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Minimum Investment (AUD)</label>
              <input type="number" min="500" value="${f.minInvestment}" oninput="APP.listingFormData.minInvestment=this.value"
                placeholder="e.g. 5000"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Expected Yield (% p.a.)</label>
              <input type="number" min="0" max="50" step="0.1" value="${f.expectedYield}" oninput="APP.listingFormData.expectedYield=this.value"
                placeholder="e.g. 8.5"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Investment Term (years)</label>
              <input type="number" min="1" max="30" value="${f.term}" oninput="APP.listingFormData.term=this.value"
                placeholder="e.g. 5"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Payout Frequency</label>
              <select oninput="APP.listingFormData.payoutFrequency=this.value"
                class="w-full border border-indigo-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                ${['Monthly','Quarterly','Half-Yearly','Annually'].map(p=>`<option value="${p}" ${f.payoutFrequency===p?'selected':''}>${p}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>` : ''}

      </div>
      <div class="flex gap-3 p-6 border-t border-gray-100">
        <button onclick="APP.showListingForm=false;render()"
          class="flex-1 py-2.5 border border-gray-200 text-gray-600 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors">
          Cancel
        </button>
        <button onclick="submitNewListing()"
          class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors">
          Submit for Review
        </button>
      </div>
    </div>`;
  setTimeout(renderListingPhotoGrid, 0);
  return overlay;
}

// ═══════════════════════════════════════════════════════════════════════════
// LISTINGS
// ═══════════════════════════════════════════════════════════════════════════
function buildListings() {
  const types = ['all', ...new Set(MOCK_LISTINGS.map(l=>l.type))];
  const regions = [
    { value:'all', label:'All Regions' },
    { value:'australia', label:'Australia' },
    { value:'bali', label:'Bali' },
  ];
  let filtered = MOCK_LISTINGS.filter(l => {
    const typeOk = APP.listingTypeFilter === 'all' || l.type === APP.listingTypeFilter;
    const regionOk = APP.listingSuburbFilter === 'all'
      || (APP.listingSuburbFilter === 'bali' && l.state === 'BALI')
      || (APP.listingSuburbFilter === 'australia' && l.state !== 'BALI');
    const liveOnly = l.status === 'LIVE';
    return typeOk && regionOk && liveOnly;
  });

  const page = el('div', '');
  const inner = el('div', 'p-8');
  inner.innerHTML = `
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Property Listings</h1>
        <p class="text-sm text-gray-400 mt-0.5">Browse properties and investments across Australia and Bali</p>
      </div>
      <div class="flex items-center gap-2">
        ${APP.currentUser ? `<button onclick="APP.showListingForm=true;render()" class="inline-flex items-center gap-2 px-4 py-2 border border-indigo-300 text-indigo-600 text-sm font-medium rounded-lg hover:bg-indigo-50 transition-colors">+ List a Property</button>` : ''}
        <button onclick="setView('invest')" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
          View Investment Pools →
        </button>
      </div>
    </div>

    <div class="flex items-center gap-3 mb-7 flex-wrap">
      <span class="text-sm font-medium text-gray-600">Filter:</span>
      <div class="flex items-center gap-2 flex-wrap">
        ${types.map(t => `
          <button onclick="APP.listingTypeFilter='${t}';render()"
            class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${APP.listingTypeFilter===t?'bg-indigo-600 text-white border-indigo-600':'bg-white text-gray-600 border-gray-200 hover:border-indigo-300'}">
            ${t === 'all' ? 'All Types' : t}
          </button>`).join('')}
      </div>
      <div class="flex items-center gap-2">
        ${regions.map(r => `
          <button onclick="APP.listingSuburbFilter='${r.value}';render()"
            class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${APP.listingSuburbFilter===r.value?'bg-indigo-600 text-white border-indigo-600':'bg-white text-gray-600 border-gray-200 hover:border-indigo-300'}">
            ${r.label}
          </button>`).join('')}
      </div>
      <span class="ml-auto text-sm text-gray-400">${filtered.length} propert${filtered.length!==1?'ies':'y'}</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="listingGrid"></div>`;

  page.appendChild(inner);

  const grid = inner.querySelector('#listingGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="col-span-3 text-center text-gray-400 py-20 text-sm">No listings match your filters.</div>';
  }
  filtered.forEach(listing => {
    const pool = MOCK_POOLS.find(p => p.id === listing.poolId);
    const pct = pool ? Math.round((pool.amountRaised / pool.targetRaise) * 100) : 0;
    const card = el('div', 'bg-white border border-gray-200 rounded-2xl overflow-hidden hover:shadow-lg transition-shadow cursor-pointer group');
    card.onclick = (e) => {
      if (e.target.closest('button') || e.target.closest('textarea')) return;
      APP.currentListing = listing;
      APP.listingDetailImgIdx = 0;
      APP.listingDetailPrevView = APP.currentUser ? 'listings' : 'browse';
      APP.view = 'listing-detail';
      render();
    };
    card.innerHTML = `
      <div class="h-44 bg-gradient-to-br ${listing.color} flex items-center justify-center relative overflow-hidden">
        <span class="text-6xl">${listing.emoji}</span>
        ${listing.image ? `<img src="${listing.image}" alt="${listing.suburb} ${listing.type}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ''}
        <div class="absolute top-3 left-3">
          <span class="bg-white/90 backdrop-blur text-gray-700 text-xs font-semibold px-2.5 py-1 rounded-full">${listing.type}</span>
        </div>
        <div class="absolute top-3 right-3 flex flex-col items-end gap-1">
          ${listing.saleType === 'buy_now'
            ? '<span class="bg-indigo-600/90 text-white text-xs font-semibold px-2.5 py-1 rounded-full">Buy Now</span>'
            : listing.saleType === 'both'
              ? '<span class="bg-indigo-600/90 text-white text-xs font-semibold px-2.5 py-1 rounded-full">Buy Now</span><span class="bg-green-500/90 text-white text-xs font-semibold px-2.5 py-1 rounded-full">+ Invest</span>'
              : pool?.status === 'FUNDED'
                ? '<span class="bg-gray-900/80 text-white text-xs font-semibold px-2.5 py-1 rounded-full">Fully Funded</span>'
                : '<span class="bg-green-500/90 text-white text-xs font-semibold px-2.5 py-1 rounded-full">Open for Investment</span>'}
        </div>
      </div>
      <div class="p-5">
        <p class="font-bold text-gray-900 text-base mb-0.5">${listing.address}</p>
        <p class="text-sm text-gray-400 mb-3">${listing.suburb}${listing.state==='BALI'?' · Bali, Indonesia':' '+listing.state+' '+listing.postcode}</p>

        ${APP.editingListingId === listing.id ? `
        <div class="mb-4">
          <textarea id="descEdit_${listing.id}" rows="4"
            class="w-full border border-indigo-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
            oninput="APP.editingDescription=this.value">${listing.description}</textarea>
          <div class="flex gap-2 mt-2">
            <button onclick="saveDescription('${listing.id}')"
              class="flex-1 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors">
              Save
            </button>
            <button onclick="cancelEditDescription()"
              class="flex-1 py-1.5 border border-gray-200 hover:bg-gray-50 text-gray-600 text-xs font-medium rounded-lg transition-colors">
              Cancel
            </button>
          </div>
        </div>` : `
        <div class="mb-4 ${APP.currentUser?.name === listing.submittedBy || APP.currentUser?.role === 'ADMIN' ? 'group relative' : ''}">
          <p class="text-sm text-gray-500 leading-relaxed pr-6">${listing.description || '<span class="italic text-gray-400">No description yet.</span>'}</p>
          ${APP.currentUser?.name === listing.submittedBy || APP.currentUser?.role === 'ADMIN' ? `
          <button onclick="startEditDescription('${listing.id}')" title="Edit description"
            class="absolute top-0 right-0 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-gray-100 text-gray-400 hover:text-indigo-600">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 012.828 2.828L11.828 15.828a2 2 0 01-1.414.586H9v-2a2 2 0 01.586-1.414z"/></svg>
          </button>` : ''}
        </div>`}

        <div class="flex items-end justify-between mb-4">
          <div>
            <p class="text-2xl font-bold text-gray-900">${fmtPrice(listing.price)}</p>
            <p class="text-xs text-gray-400">Purchase price</p>
          </div>
          <div class="text-right">
            <p class="text-lg font-bold text-green-600">${listing.rentalYield}%</p>
            <p class="text-xs text-gray-400">Rental yield</p>
          </div>
        </div>
        <div class="flex items-center gap-4 text-sm text-gray-500 mb-4">
          <span>🛏 ${listing.beds}</span>
          <span>🚿 ${listing.baths}</span>
          <span>🚗 ${listing.parking}</span>
          ${listing.landSize ? `<span>📐 ${listing.landSize}m²</span>` : ''}
        </div>
        ${(() => {
          const isBuyNow = listing.saleType === 'buy_now' || listing.saleType === 'both';
          const isInvest = !listing.saleType || listing.saleType === 'invest' || listing.saleType === 'both';
          let html = '';
          if (isInvest && pool) {
            const isFunded = pool.status === 'FUNDED';
            const myInvestment = APP.portfolio.find(p => p.poolId === pool.id);
            const annualReturn = Math.round(pool.minInvestment * pool.expectedYield / 100);
            html += `
            <div class="bg-gray-50 rounded-xl p-3 mb-4">
              <div class="flex justify-between text-xs text-gray-500 mb-1.5">
                <span>Pool raised</span>
                <span class="font-semibold text-gray-700">${pct}% · ${fmtPrice(pool.amountRaised)} of ${fmtPrice(pool.targetRaise)}</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div class="h-1.5 rounded-full ${isFunded ? 'bg-gray-400' : 'bg-indigo-500'} progress-bar" style="width:${pct}%"></div>
              </div>
              <div class="flex justify-between text-xs mt-1.5">
                <span class="text-gray-400">${pool.investorCount}/${pool.maxInvestors} investors</span>
                <span class="font-semibold text-indigo-600">${pool.expectedYield}% p.a. target</span>
              </div>
            </div>
            <div class="bg-amber-50 border border-amber-100 rounded-xl p-3 mb-4 flex items-center justify-between">
              <div>
                <p class="text-xs text-gray-500">Min $${pool.minInvestment.toLocaleString()} earns annually</p>
                <p class="text-sm font-bold text-gray-800">A$${annualReturn.toLocaleString('en-AU')} / year</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-400">${pool.payoutFrequency}</p>
                <p class="text-xs font-medium text-gray-600">payouts</p>
              </div>
            </div>
            ${myInvestment
              ? `<div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-3 text-sm flex items-center gap-2">
                  <span class="text-green-600 font-bold">✓</span>
                  <span class="text-green-700">Invested A$${myInvestment.amount.toLocaleString()} — payouts in ${myInvestment.crypto}</span>
                 </div>`
              : isFunded
                ? `<button onclick="showToast('Join waitlist for ${pool.name} (mock)')"
                    class="w-full py-2.5 border border-gray-200 text-gray-500 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors mb-3">
                    Fully Funded — Join Waitlist
                   </button>`
                : `<div class="flex gap-2 mb-3">
                    <input id="lamt_${pool.id}" type="number" min="${pool.minInvestment}" placeholder="Amount (AUD)"
                      class="flex-1 border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      oninput="APP.investAmount=this.value"/>
                    <button onclick="openCheckout('${pool.id}','lamt_${pool.id}')"
                      class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition-colors whitespace-nowrap">
                      Invest
                    </button>
                   </div>
                   <p class="text-xs text-gray-400 mb-3">Minimum investment A$${pool.minInvestment.toLocaleString()}</p>`}`;
          }
          if (isBuyNow) {
            html += `<button onclick="buyNow('${listing.id}')"
              class="w-full py-2.5 bg-gray-900 hover:bg-gray-800 text-white text-sm font-semibold rounded-lg transition-colors">
              Buy Now — ${fmtPrice(listing.price)}
            </button>`;
          }
          return html;
        })()}
      </div>`;
    grid.appendChild(card);
  });
  return page;
}

// ═══════════════════════════════════════════════════════════════════════════
// INVEST
// ═══════════════════════════════════════════════════════════════════════════
function buildInvest() {
  const page = el('div', '');
  const inner = el('div', 'p-8');
  const walletBar = APP.walletConnected
    ? `<div class="flex items-center gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-2.5 text-sm">
        <span class="w-2 h-2 bg-green-500 rounded-full pulse-dot"></span>
        <span class="text-green-700 font-medium">Wallet connected</span>
        <span class="text-green-600 font-mono text-xs">${APP.walletAddress}</span>
        <button onclick="APP.walletConnected=false;APP.walletAddress=null;render()" class="ml-auto text-xs text-gray-400 hover:text-gray-600">Disconnect</button>
       </div>`
    : '';

  inner.innerHTML = `
    <div class="flex items-start justify-between mb-2">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Investment Pools</h1>
        <p class="text-sm text-gray-400 mt-0.5">Pool funds with other investors across Australian &amp; Bali properties</p>
      </div>
      <div>${walletBar}</div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6" id="poolGrid">
    </div>`;

  page.appendChild(inner);

function adminSetStatus(listingId, status) {
  const listing = MOCK_LISTINGS.find(l => l.id === listingId);
  if (!listing) return;
  listing.status = status;
  const labels = { LIVE:'approved', PAUSED:'paused for review', REJECTED:'rejected' };
  showToast(`"${listing.address.split(',')[0]}" ${labels[status] || status}`);
}

function adminSendMessage(listingId) {
  const text = APP.adminMessageText.trim();
  if (!text) return;
  const listing = MOCK_LISTINGS.find(l => l.id === listingId);
  if (!listing) return;
  listing.adminNotes.push({ from:'Admin', text, time:'Just now', fromAdmin:true });
  APP.adminMessageListingId = null;
  APP.adminMessageText = '';
  showToast('Message sent to seller');
}

          <pre class="bg-gray-900 text-gray-100 rounded-xl p-5 text-xs overflow-x-auto leading-relaxed font-mono whitespace-pre">${`// server.js — Settlement OS Payment Server
// npm install express stripe cors @paypal/checkout-server-sdk dotenv

require('dotenv').config();
const express = require('express');
const stripe  = require('stripe')(process.env.STRIPE_SECRET_KEY);
const cors    = require('cors');
const app     = express();

app.use(cors({ origin: process.env.CLIENT_URL || '*' }));
app.use('/api/webhook', express.raw({ type: 'application/json' }));
app.use(express.json());

// ── Create Stripe Payment Intent ─────────────────────────────────────────
// Called when buyer selects Visa / Mastercard in the checkout modal
app.post('/api/payment-intent', async (req, res) => {
  const { amountAUD, metadata } = req.body;           // amountAUD in dollars
  const amountCents = Math.round(amountAUD * 100);    // Stripe uses smallest unit

  const platformFeeCents = Math.round(amountCents * 0.02); // 2% platform fee

  try {
    const intent = await stripe.paymentIntents.create({
      amount:   amountCents,
      currency: 'aud',
      payment_method_types: ['card'],
      application_fee_amount: platformFeeCents,       // routes to platform account
      metadata: {
        type:       metadata.type,    // 'investment' | 'purchase'
        listingId:  metadata.listingId,
        poolId:     metadata.poolId  || '',
        buyerEmail: metadata.buyerEmail,
        platformFeeAUD: (platformFeeCents / 100).toFixed(2),
        referenceId: 'SOS-' + Date.now().toString(36).toUpperCase(),
      },
    });
    res.json({ clientSecret: intent.client_secret });
  } catch (err) {
    console.error('PaymentIntent error:', err);
    res.status(400).json({ error: err.message });

// Register endpoint: stripe listen --forward-to localhost:3000/api/webhook
app.post('/api/webhook', (req, res) => {
  const sig = req.headers['stripe-signature'];
  let event;
  try {
    event = stripe.webhooks.constructEvent(
      req.body, sig, process.env.STRIPE_WEBHOOK_SECRET
    );
  } catch (err) {
    return res.status(400).send('Webhook signature error: ' + err.message);
  }

  switch (event.type) {
    case 'payment_intent.succeeded': {
      const pi  = event.data.object;
      const fee = parseFloat(pi.metadata.platformFeeAUD);
      console.log('[Payment OK]', pi.id, '| fee: AUD', fee, '| ref:', pi.metadata.referenceId);
      // TODO: update DB → mark pool contribution, trigger settlement workflow
      break;
    }
    case 'payment_intent.payment_failed':
      console.warn('[Payment FAILED]', event.data.object.id);
      // TODO: notify buyer, release held funds
      break;
    case 'charge.dispute.created':
      console.warn('[Dispute]', event.data.object.id);
      // TODO: gather evidence, pause related listing
      break;
  }
  res.json({ received: true });
});

    <img id="listingHeroImg" src="${images[APP.listingDetailImgIdx] || ''}" alt="${addr}"
      style="width:100%;height:100%;object-fit:cover;"/>
    <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 60%);pointer-events:none;"></div>
    ${total > 1 ? `
    <button onclick="APP.listingDetailImgIdx=(APP.listingDetailImgIdx-1+${total})%${total};document.getElementById('listingHeroImg').src=(APP.currentListing.images||[APP.currentListing.image])[APP.listingDetailImgIdx];updateThumbs();"
      style="position:absolute;left:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#1f2937" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button onclick="APP.listingDetailImgIdx=(APP.listingDetailImgIdx+1)%${total};document.getElementById('listingHeroImg').src=(APP.currentListing.images||[APP.currentListing.image])[APP.listingDetailImgIdx];updateThumbs();"
      style="position:absolute;right:16px;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#1f2937" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>` : ''}
    <div style="position:absolute;bottom:16px;right:16px;padding:4px 10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:500;border-radius:999px;" id="imgCounter">${APP.listingDetailImgIdx + 1} / ${total}</div>
    ${total > 1 ? `<div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;" id="thumbStrip">
      ${images.map((src, i) => `
        <button onclick="APP.listingDetailImgIdx=${i};document.getElementById('listingHeroImg').src='${src}';updateThumbs();"
          style="width:56px;height:40px;border-radius:8px;overflow:hidden;border:2px solid ${i===APP.listingDetailImgIdx?'#fff':'rgba(255,255,255,0.4)'};cursor:pointer;padding:0;transition:all .15s;" id="thumb_${i}">
          <img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block;"/>
        </button>`).join('')}
    </div>` : ''}`;
  page.appendChild(gallery);

  // ── Main content ──
  const main = document.createElement('div');
  main.style.cssText = 'max-width:1200px;margin:0 auto;padding:2.5rem 1.5rem;';
  main.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 340px;gap:2.5rem;align-items:start;">

      <!-- Left column -->
      <div>
        <!-- Address + price -->
        <div style="margin-bottom:1.5rem;">
          <p style="font-size:0.875rem;color:#9ca3af;margin:0 0 4px;">${subur}</p>
          <h1 style="font-size:2rem;font-weight:900;color:#111827;margin:0 0 12px;line-height:1.1;">${addr}</h1>
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span style="font-size:2rem;font-weight:800;color:#4f46e5;">$${price.toLocaleString('en-AU')} <span style="font-size:1rem;font-weight:500;color:#9ca3af;">${curr}</span></span>
            <span style="padding:4px 12px;border-radius:999px;font-size:0.75rem;font-weight:700;background:#dbeafe;color:#1d4ed8;">${status}</span>
          </div>
        </div>

        <!-- Property stats -->
        <div style="display:flex;gap:2rem;padding:1.25rem 0;border-top:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;margin-bottom:2rem;flex-wrap:wrap;">
          ${[
            { label:'Bed', value: l.beds },
            { label:'Bath', value: l.baths },
            { label:'Car', value: l.parking },
            { label:'Land', value: l.landSize ? (typeof l.landSize==='number' ? l.landSize+' m²' : l.landSize) : 'N/A' },
          ].map(s => `
            <div style="display:flex;align-items:center;gap:8px;color:#374151;">
              <span style="font-size:1.25rem;font-weight:800;color:#111827;">${s.value}</span>
              <span style="font-size:0.875rem;color:#9ca3af;">${s.label}</span>
            </div>`).join('')}
        </div>

        <!-- Description -->
        <div style="margin-bottom:2rem;">
          <h2 style="font-size:1.125rem;font-weight:800;color:#111827;margin:0 0 12px;">About this property</h2>
          ${(l.description||'No description available.').split('\n\n').map(p => `<p style="font-size:0.9rem;color:#4b5563;line-height:1.75;margin:0 0 12px;">${p}</p>`).join('')}
        </div>

        <!-- Features -->
        <div style="margin-bottom:2rem;">
          <h2 style="font-size:1.125rem;font-weight:800;color:#111827;margin:0 0 12px;">Property highlights</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            ${(l.features||[]).map(f => `
              <div style="display:flex;align-items:center;gap:8px;font-size:0.875rem;color:#374151;">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#6366f1" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                ${f}
              </div>`).join('')}
          </div>
        </div>

        <!-- Details table -->
        <div>
          <h2 style="font-size:1.125rem;font-weight:800;color:#111827;margin:0 0 12px;">Property details</h2>
          <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
            ${[
              ['Property type', l.type],
              ['Land size', l.landSize ? (typeof l.landSize==='number' ? l.landSize+' m²' : l.landSize) : 'N/A'],
              ...(l.titleRef ? [['Title reference', l.titleRef]] : []),
              ['Location', subur],
              ...(l.state==='BALI'?[['Tenure', (l.description||'').includes('Hak Milik')?'Hak Milik (Freehold)':'Leasehold']]:[] ),
              ...(l.deposit ? [['Deposit', l.deposit]] : []),
              ...(l.yearBuilt ? [['Year built', l.yearBuilt]] : []),
              ...(l.rentalYield ? [['Rental yield', l.rentalYield+'%']] : []),
              ...(l.weeklyRent ? [['Weekly rent', '$'+l.weeklyRent.toLocaleString('en-AU')+' AUD']] : []),
              ['Reference', refNo],
            ].map(([label, val], i, arr) => `
              <div style="display:flex;align-items:flex-start;padding:12px 20px;gap:16px;${i<arr.length-1?'border-bottom:1px solid #e5e7eb;':''}">
                <span style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;width:140px;flex-shrink:0;padding-top:2px;">${label}</span>
                <span style="font-size:0.875rem;color:#1f2937;">${val}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <!-- Right sidebar -->
      <div style="position:sticky;top:72px;display:flex;flex-direction:column;gap:16px;">

        <!-- Agent / Enquire card -->
        <div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px;">
          <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin:0 0 12px;">Listed by</p>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div style="width:40px;height:40px;background:#e0e7ff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span style="font-size:0.875rem;font-weight:800;color:#4f46e5;">${(l.agent?.name||l.submittedBy||'SO').split(' ').map(w=>w[0]).join('')}</span>
            </div>
            <div>
              <p style="font-size:0.875rem;font-weight:600;color:#111827;margin:0;">${l.agent?.name||l.submittedBy||'Settlement OS'}</p>
              <p style="font-size:0.75rem;color:#9ca3af;margin:0;">${l.agent?.role||'Listing Agent'} · ${l.agent?.firm||'Settlement OS'}</p>
            </div>
          </div>
          <button onclick="buyNow('${l.id}')"
            style="width:100%;padding:13px;background:#111827;color:#fff;border:none;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='#111827'">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            Buy Now — $${price.toLocaleString('en-AU')} ${curr}
          </button>

        </div>

        <!-- Investment yield / status card -->
        <div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px;">
          ${l.rentalYield ? `
            <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin:0 0 12px;">Investment snapshot</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div style="background:#f0fdf4;border-radius:10px;padding:12px;text-align:center;">
                <p style="font-size:1.25rem;font-weight:800;color:#16a34a;margin:0;">${l.rentalYield}%</p>
                <p style="font-size:0.7rem;color:#9ca3af;margin:4px 0 0;">Rental yield</p>
              </div>
              <div style="background:#eef2ff;border-radius:10px;padding:12px;text-align:center;">
                <p style="font-size:1.25rem;font-weight:800;color:#4f46e5;margin:0;">$${l.weeklyRent?.toLocaleString('en-AU')}</p>
                <p style="font-size:0.7rem;color:#9ca3af;margin:4px 0 0;">Per week</p>
              </div>
            </div>` : l.settled ? `
            <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin:0 0 12px;">Settlement status</p>
            <div style="display:flex;align-items:center;gap:8px;color:#16a34a;">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span style="font-size:0.875rem;font-weight:600;">Settled ${l.settlementDate||''}</span>
            </div>` : `
            <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin:0 0 12px;">Settlement status</p>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
              <span style="font-size:0.875rem;color:#374151;">Conditions met</span>
              <span style="font-size:0.875rem;font-weight:700;color:#4f46e5;">${l.conditionsMet||0}/${l.conditionsTotal||0}</span>
            </div>
            <div style="height:8px;background:#f3f4f6;border-radius:999px;overflow:hidden;margin-bottom:12px;">
              <div style="height:100%;width:${condPct}%;background:#6366f1;border-radius:999px;"></div>
            </div>
            ${l.daysToSettle>=0?`<div style="text-align:center;padding:8px;border-radius:8px;font-size:0.75rem;font-weight:700;background:${l.daysToSettle<=14?'#fef2f2':'#eef2ff'};color:${l.daysToSettle<=14?'#dc2626':'#4f46e5'};">${l.daysToSettle} days to settlement</div>`:''}
          `}
        </div>

        <!-- Investment pool (if linked) -->

      </div>
    </div>`;

  page.appendChild(main);

  // Footer
  const footer = document.createElement('footer');
  footer.style.cssText = 'border-top:1px solid #e5e7eb;background:#f9fafb;margin-top:3rem;';
  footer.innerHTML = `
    <div style="max-width:1200px;margin:0 auto;padding:2rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:0.8rem;color:#9ca3af;">
      <span>&copy; 2026 BALIPROP LLC · Settlement OS</span>
      <div style="display:flex;gap:1.5rem;">
        <button onclick="APP.view='browse';APP.landingTab='listings';render()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:0.8rem;" onmouseover="this.style.color='#4f46e5'" onmouseout="this.style.color='#9ca3af'">All listings</button>
        <button onclick="APP.view='contact';render()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:0.8rem;" onmouseover="this.style.color='#4f46e5'" onmouseout="this.style.color='#9ca3af'">Contact</button>
        <button onclick="APP.view='browse';APP.landingTab='invest';render()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:0.8rem;" onmouseover="this.style.color='#4f46e5'" onmouseout="this.style.color='#9ca3af'">Invest</button>
      </div>
    </div>`;
  page.appendChild(footer);

  return page;
}

function updateThumbs() {
  const idx = APP.listingDetailImgIdx;
  const total = APP.currentListing?.images?.length || 1;
  const counter = document.getElementById('imgCounter');
  if (counter) counter.textContent = `${idx + 1} / ${total}`;
  for (let i = 0; i < total; i++) {
    const t = document.getElementById('thumb_' + i);
    if (t) t.style.borderColor = i === idx ? '#fff' : 'rgba(255,255,255,0.4)';
  }
}

// ── Admin Deal Messaging ───────────────────────────────────────────────────
function buildAdminDealMessages(deal) {
  // Temporarily set current user to admin so buildMessagesTab renders correctly
  const prev = APP.currentUser;
  if (!APP.currentUser) APP.currentUser = { name:'Admin User', role:'ADMIN' };

  // Sync party selection to admin-specific state key
  APP.messagesParty = APP.adminDealMessagesParty;

  const wrap = document.createElement('div');
  wrap.className = 'p-8';

  // Header
  wrap.innerHTML = `
    <div class="flex items-center gap-4 mb-6">
      <button onclick="APP.adminDealId=null;APP.adminDealMessagesParty=null;APP.messagesParty=null;render()"
        class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>Back to Admin
      </button>
      <span class="text-gray-300">·</span>
      <div>
        <span class="text-sm font-semibold text-gray-900">${deal.referenceNo || deal.id}</span>
        <span class="text-sm text-gray-400 ml-2">${deal.address}</span>
      </div>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 ml-auto">${deal.status}</span>
    </div>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm">
      <div class="p-5 border-b border-gray-100">
        <div class="flex items-center gap-2 mb-1">
          <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
          </svg>
          <h2 class="font-semibold text-gray-900">Message Deal Parties</h2>
        </div>
        <p class="text-xs text-gray-400 ml-7">Select a party on the left to start or continue a conversation</p>
      </div>
      <div class="p-5" id="adminDealMsgContent"></div>
    </div>`;

  wrap.querySelector('#adminDealMsgContent').appendChild(buildMessagesTab(deal));

  APP.currentUser = prev;
  return wrap;
}

function sendAdminDealMessage(dealId, partyName) {
  // Save party selection to admin-specific key before delegating
  APP.adminDealMessagesParty = partyName;
  sendDealMessage(dealId, partyName);
  APP.adminDealMessagesParty = APP.messagesParty;
}

function contactSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('contact-submit');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  setTimeout(() => {
    document.getElementById('contact-form-wrap').style.display = 'none';
    const s = document.getElementById('contact-success');
    s.style.display = 'flex';
  }, 900);
}

function contactReset() {
  document.getElementById('contact-form-wrap').style.display = 'block';
  document.getElementById('contact-success').style.display = 'none';
  document.getElementById('contact-form').reset();
  const btn = document.getElementById('contact-submit');
  btn.disabled = false;
  btn.textContent = 'Send Message →';
}

// ── Boot ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>

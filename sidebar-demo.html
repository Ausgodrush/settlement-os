<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar Demo — Settlement OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .nav-link { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:8px; font-size:14px; font-weight:500; color:#4B5563; transition:background .15s,color .15s; text-decoration:none; }
    .nav-link:hover { background:#F9FAFB; color:#111827; }
    .nav-link.active { background:#EEF2FF; color:#4338CA; }
    .bar { display:block; height:2px; background:currentColor; border-radius:9999px; transition:all .2s; }
    #main-nav.hidden { display:none; }

    @media (max-width: 640px) {
      body { flex-direction: column; }
      aside { width: 100%; min-height: unset; border-right: none; border-bottom: 1px solid #e5e7eb; }
      main { padding: 1.5rem 1rem; }
      #burger-btn { padding-top: 0.875rem; padding-bottom: 0.875rem; }
      .nav-link { padding: 10px 12px; font-size: 15px; }
    }
  </style>
</head>
<body class="bg-gray-100 flex min-h-screen">

  <aside class="w-64 min-h-screen bg-white border-r border-gray-200 flex flex-col">

    <!-- The Settlement OS title IS the burger button -->
    <button
      id="burger-btn"
      aria-expanded="true"
      aria-controls="main-nav"
      data-testid="burger-menu"
      onclick="toggleNav()"
      class="w-full px-4 py-4 border-b border-gray-100 flex items-center gap-3 hover:bg-gray-50 transition-colors group text-left cursor-pointer border-0 bg-transparent"
    >
      <div class="w-8 h-8 flex-shrink-0 relative" id="burger-icon">
        <!-- Hamburger icon (visible when closed) -->
        <span id="icon-open" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s;">
          <svg width="20" height="16" viewBox="0 0 18 14" fill="#9CA3AF">
            <rect y="0" width="18" height="2" rx="1"/>
            <rect y="6" width="18" height="2" rx="1"/>
            <rect y="12" width="18" height="2" rx="1"/>
          </svg>
        </span>
        <!-- X icon (visible when open) -->
        <span id="icon-close" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .2s;opacity:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </span>
      </div>
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <div class="flex-1 min-w-0 text-left">
        <p class="font-semibold text-gray-900 text-sm">Settlement OS</p>
        <p class="text-xs text-gray-400">Settlement Platform</p>
      </div>
    </button>

    <nav id="main-nav" class="p-4 space-y-1 border-b border-gray-100">
      <a href="#" class="nav-link active">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Home
      </a>
      <a href="#" class="nav-link">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
        Listings
      </a>
      <a href="#" class="nav-link">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
        Invest
      </a>
      <a href="#" class="nav-link">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        Deals
      </a>
      <a href="#" class="nav-link">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg>
        Portfolio
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100 mt-auto">
      <a href="#" class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors" style="text-decoration:none">
        Sign in
      </a>
    </div>
  </aside>

  <main class="flex-1 p-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Sidebar demo</h1>
    <p class="text-gray-500">Click the <strong>Settlement OS</strong> title button to toggle the nav open/closed.</p>
    <p class="text-gray-400 text-sm mt-4">Static preview — nothing committed yet.</p>
  </main>

  <script>
    let open = true;
    function toggleNav() {
      open = !open;
      const nav = document.getElementById('main-nav');
      const btn = document.getElementById('burger-btn');
      const iconOpen  = document.getElementById('icon-open');
      const iconClose = document.getElementById('icon-close');

      btn.setAttribute('aria-expanded', String(open));
      nav.classList.toggle('hidden', !open);

      iconOpen.style.opacity  = open ? '0' : '1';
      iconClose.style.opacity = open ? '1' : '0';
    }
    /* Desktop: start open (show X). Mobile: start closed (show hamburger). */
    if (window.innerWidth <= 640) {
      open = false;
      document.getElementById('main-nav').classList.add('hidden');
      document.getElementById('burger-btn').setAttribute('aria-expanded', 'false');
      document.getElementById('icon-open').style.opacity  = '1';
      document.getElementById('icon-close').style.opacity = '0';
    } else {
      document.getElementById('icon-open').style.opacity  = '0';
      document.getElementById('icon-close').style.opacity = '1';
    }
  </script>
</body>
</html>
